# Renovate owns version updates. A zero limit disables only version PRs;
# native Dependabot security updates remain enabled in repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix(deps)
      prefix-development: fix(deps)
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    labels: [dependencies, security]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix(deps)
    labels: [dependencies, security]
