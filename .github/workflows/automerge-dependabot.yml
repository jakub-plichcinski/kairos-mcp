# Virtual AI employee, part B1: zero-click dependency updates.
# Enables GitHub auto-merge on Dependabot and Renovate PRs so they merge the
# moment required checks pass — no manual clicking. Requires AUTO_MERGE_TOKEN
# (a token able to satisfy branch protection; GITHUB_TOKEN cannot).
# workflow_dispatch mode arms auto-merge on all already-open bot PRs.
name: Automerge dependabot and renovate PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.base.ref == 'main' &&
       (github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == 'renovate[bot]'))
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - name: Arm auto-merge on bot PR(s)
        run: |
          set -uo pipefail
          arm() {
            local pr="$1"
            if gh pr merge "$pr" --auto --squash 2>&1; then
              echo "Auto-merge armed on PR #${pr}."
            else
              echo "Could not arm auto-merge on PR #${pr} (already merged, checks state, or token permission)." >&2
            fi
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh pr list --base main --state open --limit 100 \
              --json number,author,isDraft \
              --jq '.[] | select(.isDraft | not) | select(.author.login == "dependabot[bot]" or .author.login == "renovate[bot]") | .number' \
              | while read -r pr; do arm "$pr"; done
          else
            arm "${{ github.event.pull_request.number }}"
          fi
