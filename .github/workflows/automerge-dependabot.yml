name: Dependency merge controller

on:
  workflow_run:
    workflows: [Integration, Security, Automation policy]
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect candidates without updating or merging
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dependency-merge-controller
  cancel-in-progress: false

jobs:
  reconcile:
    if: vars.AUTOMATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile trusted dependency PRs (API only)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AUTOMATION_USER_ID: ${{ vars.AUTOMATION_USER_ID }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: node scripts/ci-automation.mjs
