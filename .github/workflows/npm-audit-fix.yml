# Virtual AI employee, part C: daily npm audit fix with conditional patch releases.
# Daily: if npm audit reports fixable advisories, run npm audit fix. When npm's
# resolver blocks on a peer-dependency tree conflict, retry once with
# --force so the automation can still open the patch-release PR instead of
# requiring a manual retry. A patch-release PR is opened ONLY when a fix
# actually changed package.json/package-lock.json; clean runs exit as a no-op.
# The bump uses npm run release:patch per the release-semver skill contract
# (version:sync keeps skills/embed-docs/compose/helm aligned). On merge,
# release-tag-on-version-bump.yml tags and dispatches Release, so security
# patches ship end-to-end unattended. Version-bump policy: patch bumps only
# for security fixes, not for routine dependency updates.
# Requires AUTO_MERGE_TOKEN (same secret as the other automation workflows).
name: npm audit fix (daily)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: npm-audit-fix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HUSKY: 0
      GH_TOKEN: ${{ secrets.GH_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Dedupe open audit-fix PRs
        id: dedupe
        run: |
          set -euo pipefail
          open=$(gh pr list --base main --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/audit-fix-"))] | length')
          if [ "$open" != "0" ]; then
            echo "An audit-fix PR is already open; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and assess advisories
        id: assess
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm ci
          if npm audit --audit-level=moderate > audit-before.txt 2>&1; then
            echo "No moderate-or-higher advisories; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            tail -n 30 audit-before.txt
          fi

      - name: Apply fixes and verify
        id: fix
        if: steps.dedupe.outputs.skip != 'true' && steps.assess.outputs.skip == 'false'
        run: |
          set -euo pipefail
          set +e
          npm audit fix 2>&1 | tee audit-fix.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "mode=standard" >> "$GITHUB_OUTPUT"
          else
            if grep -q 'ERESOLVE unable to resolve dependency tree' audit-fix.txt; then
              echo "npm audit fix hit ERESOLVE; retrying with --force."
              set +e
              npm audit fix --force 2>&1 | tee -a audit-fix.txt
              status=${PIPESTATUS[0]}
              set -e
              [ "$status" -eq 0 ] || exit "$status"
              echo "mode=force" >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi
          npm audit --audit-level=moderate
          git diff --quiet -- package-lock.json package.json && { echo "audit fix changed nothing; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "skip=false" >> "$GITHUB_OUTPUT"
          npm run build

      - name: Open patch-release PR with auto-merge
        if: steps.dedupe.outputs.skip != 'true' && steps.assess.outputs.skip == 'false' && steps.fix.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Skill contract (kairos-dev/references/release-semver.md): bump via
          # release:patch so version:sync updates skills/embed-docs/compose/helm.
          npm run release:patch
          VERSION=$(node -p "require('./package.json').version")
          datestamp=$(date -u +%Y%m%d)
          branch="chore/audit-fix-${datestamp}"
          git checkout -b "$branch"
          git add package.json package-lock.json src/embed-docs/mem/ .agents/skills/ compose.yaml helm/kairos-mcp/
          git commit -m "release: ${VERSION} (npm audit fix)"
          git push origin "$branch"
          {
            echo "Automated daily \`npm audit fix\` run resolved moderate-or-higher advisories."
            if [ "${{ steps.fix.outputs.mode }}" = "force" ]; then
              echo ""
              echo "> NOTE: the workflow retried with \`npm audit fix --force\` after npm reported an \`ERESOLVE\` dependency-tree conflict."
            fi
            echo ""
            echo '```'
            tail -n 30 audit-before.txt
            echo '```'
            echo ""
            echo "Patch version bumped to ${VERSION} via release:patch (version:sync applied)."
            echo "On merge, Release tag on version bump tags and dispatches Release."
          } > pr-body.md
          pr=$(gh pr create --base main --head "$branch" \
            --title "release: ${VERSION} (npm audit fix, ${datestamp})" \
            --body-file pr-body.md)
          gh pr merge "$pr" --auto --squash
