# Virtual AI employee, part C: scheduled npm audit fix with patch releases.
# Weekly: if npm audit reports fixable advisories, run npm audit fix (never
# --force), bump the patch version, open an auto-merge PR. On merge,
# release-tag-on-version-bump.yml tags and dispatches Release, so security
# patches ship end-to-end unattended. Version-bump policy: patch bumps only
# for security fixes, not for routine dependency updates.
# Requires AUTO_MERGE_TOKEN (same secret as the other automation workflows).
name: npm audit fix (weekly)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: npm-audit-fix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Dedupe open audit-fix PRs
        id: dedupe
        run: |
          set -euo pipefail
          open=$(gh pr list --base main --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/audit-fix-"))] | length')
          if [ "$open" != "0" ]; then
            echo "An audit-fix PR is already open; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and assess advisories
        id: assess
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm ci
          if npm audit --audit-level=moderate > audit-before.txt 2>&1; then
            echo "No moderate-or-higher advisories; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            tail -n 30 audit-before.txt
          fi

      - name: Apply fixes and verify
        id: fix
        if: steps.dedupe.outputs.skip != 'true' && steps.assess.outputs.skip == 'false'
        run: |
          set -euo pipefail
          npm audit fix
          npm audit --audit-level=moderate
          git diff --quiet -- package-lock.json package.json && { echo "audit fix changed nothing; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "skip=false" >> "$GITHUB_OUTPUT"
          npm run build

      - name: Open patch-release PR with auto-merge
        if: steps.dedupe.outputs.skip != 'true' && steps.assess.outputs.skip == 'false' && steps.fix.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          datestamp=$(date -u +%Y%m%d)
          branch="chore/audit-fix-${datestamp}"
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "fix(deps): npm audit fix + patch release"
          git push origin "$branch"
          {
            echo "Automated weekly \`npm audit fix\` run resolved moderate-or-higher advisories."
            echo ""
            echo '```'
            tail -n 30 audit-before.txt
            echo '```'
            echo ""
            echo "Patch version bumped; on merge, Release tag on version bump tags and dispatches Release."
          } > pr-body.md
          pr=$(gh pr create --base main --head "$branch" \
            --title "fix(deps): npm audit fix + patch release (${datestamp})" \
            --body-file pr-body.md)
          gh pr merge "$pr" --auto --squash || echo "Could not arm auto-merge (token permission?)."
