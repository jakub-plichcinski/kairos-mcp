name: Renovate

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Full extraction and update preview without mutations
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    if: vars.AUTOMATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install and validate pinned Renovate without automation credentials
        run: node scripts/ci-renovate.mjs validate
      - name: Repository-scoped Renovate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AUTOMATION_USER_ID: ${{ vars.AUTOMATION_USER_ID }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: node scripts/ci-renovate.mjs
